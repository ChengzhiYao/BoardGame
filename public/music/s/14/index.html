<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1424">
<title>♪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/music/assets/style.css?v=20261111o">
</head>
<body data-song="14">
<div class="backdrop"></div>
<canvas id="scene"></canvas>

<div class="gate" role="button" aria-label="开始播放">
  <div class="gate-inner">
    <div class="gate-no"></div>
    <div class="gate-title"></div>
    <div class="gate-hint">轻触开始</div>
  </div>
</div>

<main>
  <div class="topbar rise"><span id="no"></span><a href="/music">全部歌曲</a></div>

  <div class="cover-wrap rise">
    <img id="cover" alt="">
    <div class="cover-shade"></div>
    <section class="lyrics-box" id="lyricsBox" aria-label="歌词">
      <div class="lyrics-scroll" id="lyrics"></div>
    </section>
  </div>

  <div class="meta rise">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>
  </div>

  <div class="player rise">
    <canvas id="viz"></canvas>
    <div class="bar"><div class="bar-track"></div><div class="bar-fill"></div><div class="bar-knob"></div></div>
    <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    <div class="controls">
      <button class="ctl" id="back" aria-label="后退 10 秒">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="ctl main" id="play" aria-label="播放 / 暂停">
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a.6.6 0 0 0 .9.5l10.4-6.5a.6.6 0 0 0 0-1L8.9 5a.6.6 0 0 0-.9.5z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="5" width="3.6" height="14" rx="1"/><rect x="13.9" y="5" width="3.6" height="14" rx="1"/></svg>
      </button>
      <button class="ctl loop" id="loop" aria-label="单曲循环">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
      </button>
    </div>
  </div>

  <section class="letter rise">
    <div class="letter-head"><span>写给你</span><span id="when"></span></div>
    <div id="note"></div>
  </section>

  <div class="foot">♪</div>
</main>

<script src="/music/assets/songs.js?v=20261111o"></script>
<script src="/music/assets/scene.js?v=20261111o"></script>
<script src="/music/assets/player.js?v=20261111o"></script>
</body>
</html>
